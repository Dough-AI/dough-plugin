# CI for the published plugin. The version check is the load-bearing one:
# the version-gated desktop client reads plugins[0].version from
# marketplace.json, so if it drifts from plugin.json the release merges
# cleanly and is then uninstallable, with the CLI's SHA fallback hiding it.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege for GITHUB_TOKEN, and it applies to every job below. Nothing
# here writes: each job checks out, installs, and runs. Without this the token
# carries whatever the repository default happens to be, which is how a workflow
# that only ever reads ends up able to push -- flagged by CodeQL as
# actions/missing-workflow-permissions.
permissions:
  contents: read

jobs:
  versions:
    name: Plugin versions agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: plugin.json and marketplace.json must declare the same version
        run: |
          python3 - <<'PY'
          import json, sys
          p = json.load(open(".claude-plugin/plugin.json"))
          m = json.load(open(".claude-plugin/marketplace.json"))
          pv = p.get("version")
          mv = (m.get("plugins") or [{}])[0].get("version")
          print(f"plugin.json      version = {pv}")
          print(f"marketplace.json version = {mv}")
          if pv is None or mv is None:
              sys.exit("FAIL: a version field is missing")
          if pv != mv:
              sys.exit("FAIL: versions disagree — the desktop client reads marketplace.json")
          print("OK")
          PY

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Syntax and undefined-name check
        run: |
          pip install ruff
          ruff check --select E9,F63,F7,F82 .

  tests:
    # This plugin ships to CUSTOMER machines, a large share of them Windows, and
    # until now every job here ran on Ubuntu. Four Windows-only bugs reached
    # customers that way -- a POSIX-only path pattern that made `dough propose`
    # attach no evidence, a triage that could never report CONNECTED without
    # gcloud, a test rig that wiped SystemRoot, and an `os.path.isabs` that is
    # wrong in the opposite direction on each platform. Each one cost a VM and a
    # hand-run session to find, and every one of them would have failed here.
    #
    # The Python dimension is not padding: `ntpath.isabs("/work/a.csv")` returns
    # True on 3.12 and False from 3.13, so the fourth bug above is INVISIBLE to a
    # Windows runner pinned to 3.12. These scripts are stdlib-only and run on
    # whatever Python the user happens to have, so the matrix says so too.
    #
    # fail-fast is off deliberately: one run should report every platform's
    # failures, not just whichever finished first.
    name: Tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - name: pytest
        # The repository declares no dependency manifest, so test deps are
        # listed here. openpyxl is required by tests/test_dough_excel.py.
        #
        # `-rs` prints the reason for every skip. A suite that reports only
        # "14 skipped" is how one of the bugs above hid: the live tests were
        # skipping because triage could not say CONNECTED, and a broken skip
        # looks exactly like a deliberate one in the summary line.
        run: |
          pip install pytest openpyxl
          pytest tests -q -rs
